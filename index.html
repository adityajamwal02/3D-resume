<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="theme-color" content="#101211" />
    <script>
      (() => {
        let theme;
        try {
          theme = localStorage.getItem("portfolio-theme");
        } catch {}
        if (theme !== "light" && theme !== "dark") {
          theme = matchMedia("(prefers-color-scheme: light)").matches
            ? "light"
            : "dark";
        }
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
        document.querySelector('meta[name="theme-color"]').content =
          theme === "light" ? "#f4f7f6" : "#111216";
      })();
    </script>
    <link rel="icon" href="./monogram.svg" type="image/svg+xml" />
    <meta
      property="og:title"
      content="Aditya Jamwal | Software Engineer &amp; Mentor"
    />
    <meta
      property="og:description"
      content="Software Engineer at Microsoft, building cloud infrastructure and distributed systems. Explore Aditya Jamwal's work and mentorship for careers, resumes, and interviews."
    />
    <meta property="og:type" content="website" />
    <meta
      name="description"
      content="Aditya Jamwal, Software Engineer at Microsoft and mentor. Explore cloud infrastructure and distributed systems work, plus guidance on careers, resumes, and interviews."
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aditya Jamwal | Software Engineer &amp; Mentor</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
