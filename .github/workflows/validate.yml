name: Validate and deploy portfolio

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      refresh_topmate:
        description: Refresh Topmate now, even if the snapshot is not due
        type: boolean
        default: false
  schedule:
    # The script fetches only when the last successful snapshot is 72+ hours old.
    - cron: "23 * * * *"

permissions:
  contents: read

concurrency:
  group: portfolio-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      deploy: ${{ github.event_name != 'schedule' || steps.refresh.outputs.changed == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Refresh Topmate when due
        id: refresh
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          FORCE_REFRESH: ${{ inputs.refresh_topmate || false }}
        run: |
          if [ "$FORCE_REFRESH" = "true" ]; then
            npm run refresh:topmate
          else
            npm run refresh:topmate -- --if-due
          fi
      - run: npm ci
        if: github.event_name != 'schedule' || steps.refresh.outputs.changed == 'true'
      - run: npm run lint
        if: github.event_name != 'schedule' || steps.refresh.outputs.changed == 'true'
      - run: npm run test:sync
        if: github.event_name != 'schedule' || steps.refresh.outputs.changed == 'true'
      - run: npm run build
        if: github.event_name != 'schedule' || steps.refresh.outputs.changed == 'true'
      - run: npx playwright install --with-deps chromium
        if: github.event_name != 'schedule' || steps.refresh.outputs.changed == 'true'
      - run: npm test
        if: github.event_name != 'schedule' || steps.refresh.outputs.changed == 'true'
      - name: Persist verified Topmate snapshot
        if: github.ref == 'refs/heads/main' && steps.refresh.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/topmate.json
          git commit -m "Refresh public Topmate statistics" -m "Co-authored-by: Copilot <223556219+Copilot@users.noreply.github.com>"
          git push origin HEAD:main
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && (github.event_name != 'schedule' || steps.refresh.outputs.changed == 'true')
        with:
          path: dist
      - uses: actions/upload-artifact@v4
        if: always() && (github.event_name != 'schedule' || steps.refresh.outputs.changed == 'true')
        with:
          name: browser-results
          path: test-results/
          retention-days: 7

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.validate.outputs.deploy == 'true'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
